apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
  ref:
    semver: 0.27.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: cnpg
    namespace: flux-system
