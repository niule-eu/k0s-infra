apiVersion: v1
kind: Namespace
metadata:
  name: network-infra-ams23
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: coredns-kube-system
  namespace: network-infra-ams23
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: UDPRoute
    namespace: kube-system
  - group: gateway.networking.k8s.io
    kind: TCPRoute
    namespace: kube-system
  - group: gateway.networking.k8s.io
    kind: TLSRoute
    namespace: kube-system
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: kube-system
  to:
  - group: ''
    kind: Service
