apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kea-postgres
  namespace: network-infra-ams23
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: kea
      owner: kea
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kea-dhcpv4
  namespace: network-infra-ams23
spec:
  template:
    spec:
      containers:
      - securityContext:
          capabilities:
            add:
            - CAP_NET_ADMIN
            - CAP_NET_RAW
            - CAP_NET_BIND_SERVICE
        image: ghcr.io/niule-eu/homelab/kea-dhcpv4-slim:3.1.5
        name: kea-dhcpv4
  replicas: 1
  selector: {}
